<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Favicon -->
		<link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
		<link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="/assets/favicon/site.webmanifest" />

		<!-- Preload fonts, then load critical CSS -->
		<link rel="preload" href="/assets/fonts/StrongHeartScript.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/assets/fonts/GeneralSans-Variable.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="%sveltekit.assets%/global.css" />
		<noscript>
			<!-- The entrance animations wait for use:isIntersecting to add .show, so without JS show everything outright.
			     !important beats the components' scoped (higher specificity) styles. The hero content waits on the tagline's .show -->
			<style>
				/* The homepage card spread needs scrollProgress (and the measured quote height), so unpin it: the cards, then the
				   quote below them, as with reduced motion */
				div.offerings-track {
					height: auto !important;
					margin-bottom: 0 !important;
				}

				div.offerings-stage {
					position: static !important;
				}

				div.offerings-stage > * {
					grid-area: auto !important;
				}

				a.offering-card {
					translate: none !important;
					scale: none !important;
				}

				figure.testimonial {
					opacity: 1 !important;
					transform: none !important;
				}

				.heading-fade-in span,
				.scroll-fade-up,
				.group-stagger-fade > *,
				section.hero div.hero-content :is(h1, p.subheading, div.hero-buttons) {
					opacity: 1 !important;
					filter: none !important;
					transform: none !important;
					transition: none !important;
				}

				/* The calendar loads with JS, so its placeholder swaps "Loading…" for its no-JS message */
				p.event-calendar-loading {
					display: none !important;
				}

				p.event-calendar-nojs {
					display: block !important;
				}
			</style>
		</noscript>

		<!-- Plausible Analytics -->
		<script defer data-domain="madhucollective.ca" src="/js/script.tagged-events.js"></script>

		%sveltekit.head%
		<script>
			// CSS variable for the real viewport height (handles mobile browser UI bars)
			document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
		</script>
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<link rel="stylesheet" href="%sveltekit.assets%/global-noncritical.css" />
	</body>
</html>
