<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Favicon -->
		<link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
		<link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="/assets/favicon/site.webmanifest" />

		<!-- Preload fonts, then load critical CSS -->
		<link rel="preload" href="/assets/fonts/StrongHeartScript.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/assets/fonts/GeneralSans-Variable.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="%sveltekit.assets%/global.css" />

		<!-- Plausible Analytics -->
		<script defer data-domain="madhucollective.ca" src="/js/script.tagged-events.js"></script>

		%sveltekit.head%
		<script>
			// CSS variable for the real viewport height (handles mobile browser UI bars)
			document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
		</script>
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<link rel="stylesheet" href="%sveltekit.assets%/global-noncritical.css" />
	</body>
</html>
