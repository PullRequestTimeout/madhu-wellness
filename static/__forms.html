<!doctype html>
<!-- Never shown to visitors. The site is server-rendered, so Netlify can't see the Svelte contact form
     (src/lib/components/ContactPanel.svelte) at build time; this static copy lets it detect the form.
     Keep the field names in sync with the component. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Netlify form detection</title>
		<meta name="robots" content="noindex" />
	</head>
	<body>
		<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
			<input name="first-name" />
			<input name="last-name" />
			<input name="email" type="email" />
			<input name="phone" type="tel" />
			<textarea name="message"></textarea>
			<input name="bot-field" />
		</form>
	</body>
</html>
